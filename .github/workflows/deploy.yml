
name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch: # يسمح لك بتشغيل العملية يدوياً من تبويب Actions

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      # أيقونة واحدة في resources/icon.png تخدم الموقع والتطبيق معاً
      - name: Generate web icons
        run: |
          if [ -f "resources/icon.png" ]; then
            python3 -m pip install --quiet --upgrade pillow
            python3 native/android/generate-web-icons.py resources/icon.png public
          else
            echo "لا توجد resources/icon.png - ستُستخدم الأيقونات الموجودة في public"
          fi

      - name: Build
        run: npm run build

      - name: Upload Artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
